<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel AI Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Travel AI Planner</h1>
        <div class="input-section">
            <input type="text" id="request-id" placeholder="Request ID (e.g. REQ-1)" value="REQ-1">
            <textarea id="request-text" rows="4" placeholder="Enter travel request here...">5 days in Kerala for a family of 4 (2 adults, kids aged 8 and 11), mid-range budget around 60,000 total, we love nature and local food and prefer a relaxed pace.</textarea>
            <button id="generate-btn">Generate Itinerary</button>
        </div>
        
        <div id="loading" class="hidden">Generating itinerary... Please wait.</div>
        <div id="error" class="hidden error-msg"></div>
        
        <div id="result-section" class="hidden">
            <div class="summary-card">
                <h2 id="plan-status"></h2>
                <p id="plan-summary"></p>
                <div class="meta-info">
                    <span id="plan-total" class="tag price-tag"></span>
                    <span id="plan-validation" class="tag validation-tag"></span>
                    <span id="plan-review" class="tag review-tag"></span>
                </div>
            </div>
            
            <div id="days-container"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
